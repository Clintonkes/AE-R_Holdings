services:
  - type: web
    name: ae-r-holdings
    runtime: image
    image:
      url: # Leave blank to build from Dockerfile in repo root
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: ae-r-holdings-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "AE$R Holdings <onboarding@resend.dev>"
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://ae-r-holdings.onrender.com"]'
      - key: NEXT_PUBLIC_API_URL
        value: https://ae-r-holdings.onrender.com
      - key: BASE_URL
        value: https://ae-r-holdings.onrender.com
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: ae-r-holdings-db
    plan: free
    databaseName: ae_r_holdings
    ipAllowList: []
